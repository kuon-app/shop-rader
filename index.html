<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行きたい店レーダー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f5f5f5; color: #1a1a1a; }
.app { max-width: 680px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; display:flex; align-items:center; gap:8px; }
.tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.tab { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; background: #fff; color: #666; }
.tab.active { background: #f0f0f0; color: #1a1a1a; border-color: #bbb; font-weight: 500; }
.section { display: none; }
.section.active { display: block; }
.card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; }
input[type=text], select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a; margin-bottom: 8px; }
button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; background: #fff; color: #1a1a1a; font-family: inherit; }
button:hover { background: #f5f5f5; }
button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
button.primary:hover { opacity: 0.85; }
.store-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.store-item:last-child { border-bottom: none; }
.store-name { font-size: 14px; font-weight: 500; }
.store-meta { font-size: 12px; color: #888; margin-top: 2px; }
.badge-match { display:inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #E1F5EE; color: #0F6E56; }
.badge-fav { display:inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #FAEEDA; color: #854F0B; margin-left: 4px; }
.badge-import { display:inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #EEF2FF; color: #3730A3; margin-left: 4px; }
.empty { font-size: 13px; color: #999; text-align: center; padding: 2rem 0; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; gap: 12px; }
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 13px; min-width: 120px; }
.setting-sub { font-size: 11px; color: #999; margin-top: 2px; }
.time-input { display: flex; align-items: center; gap: 6px; }
.time-input input[type=number] { width: 56px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; text-align: center; margin: 0; }
.transport-btn { padding: 5px 10px; font-size: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; color: #888; }
.transport-btn.selected { background: #f0f0f0; color: #1a1a1a; border-color: #bbb; font-weight: 500; }
.section-title { font-size: 11px; font-weight: 500; color: #999; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.result-card { background: #f8f8f8; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 8px; }
.import-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; gap: 8px; }
.import-item:last-child { border-bottom: none; }
.file-drop { border: 2px dashed #ddd; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; color: #999; font-size: 14px; margin-bottom: 12px; }
.file-drop:hover { border-color: #bbb; background: #fafafa; }
#import-preview { max-height: 400px; overflow-y: auto; }
</style>
</head>
<body>
<div class="app">
  <h1>📍 行きたい店レーダー</h1>

  <div class="tabs">
    <button class="tab active" onclick="showTab('search')">🔍 予定から探す</button>
    <button class="tab" onclick="showTab('add')">＋ 登録</button>
    <button class="tab" onclick="showTab('list')">📋 リスト</button>
    <button class="tab" onclick="showTab('import')">📥 取り込む</button>
    <button class="tab" onclick="showTab('settings')">⚙️ 設定</button>
  </div>

  <!-- 予定から探す -->
  <div id="sec-search" class="section active">
    <div class="card">
      <div style="font-size:13px; color:#888; margin-bottom:8px;">明日どこに行く？</div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="dest-input" placeholder="例：上野、渋谷、新宿..." style="margin:0; flex:1;" />
        <button class="primary" onclick="searchStores()">探す ↗</button>
      </div>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- 登録 -->
  <div id="sec-add" class="section">
    <div class="card">
      <input type="text" id="add-name" placeholder="店名" />
      <input type="text" id="add-area" placeholder="エリア（例：上野、銀座）" />
      <select id="add-genre">
        <option value="">ジャンルを選ぶ</option>
        <option value="カフェ・パン">カフェ・パン</option>
        <option value="ランチ・ごはん">ランチ・ごはん</option>
        <option value="雑貨・服・本">雑貨・服・本</option>
        <option value="特別な店">特別な店・記念日</option>
        <option value="その他">その他</option>
      </select>
      <div style="font-size:13px; color:#888; margin-bottom:6px;">お気に入り度</div>
      <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
        <button class="transport-btn" id="fav1" onclick="setFav(1)">★ 気になる</button>
        <button class="transport-btn" id="fav2" onclick="setFav(2)">★★ 行きたい</button>
        <button class="transport-btn selected" id="fav3" onclick="setFav(3)">★★★ 絶対行く</button>
      </div>
      <input type="text" id="add-memo" placeholder="メモ（任意）" style="margin-bottom:12px;" />
      <button class="primary" style="width:100%;" onclick="addStore()">登録する</button>
    </div>
  </div>

  <!-- リスト -->
  <div id="sec-list" class="section">
    <div style="font-size:13px; color:#888; margin-bottom:8px;" id="list-count"></div>
    <div class="card">
      <div id="store-list-container"></div>
    </div>
  </div>

  <!-- 取り込む -->
  <div id="sec-import" class="section">
    <div class="card">
      <div style="font-size:13px; font-weight:500; margin-bottom:8px;">GoogleマップのCSV / JSONを取り込む</div>
      <div style="font-size:12px; color:#888; margin-bottom:12px;">「行ってみたい.csv」「お気に入りの場所.csv」などを選んでください</div>
      <div class="file-drop" onclick="document.getElementById('file-input').click()">
        📂 ファイルを選ぶ（CSV or JSON）
      </div>
      <input type="file" id="file-input" accept=".json,.csv" style="display:none;" onchange="loadFile(event)" />
    </div>
    <div id="import-preview"></div>
  </div>

  <!-- 設定 -->
  <div id="sec-settings" class="section">
    <div class="card">
      <div class="section-title">移動手段</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="transport-btn" id="t-walk" onclick="setTransport('walk')">🚶 徒歩</button>
        <button class="transport-btn selected" id="t-train" onclick="setTransport('train')">🚃 電車</button>
        <button class="transport-btn" id="t-car" onclick="setTransport('car')">🚗 車</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">ジャンル別 通知範囲</div>
      <div class="setting-row">
        <div><div class="setting-label">カフェ・パン</div><div class="setting-sub">ランチ・ごはんも同じ</div></div>
        <div class="time-input"><input type="number" id="t-cafe" value="10" min="1" max="60" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">雑貨・服・本</div></div>
        <div class="time-input"><input type="number" id="t-goods" value="7" min="1" max="60" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">特別な店</div></div>
        <div class="time-input"><input type="number" id="t-special" value="15" min="1" max="60" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">お気に入り度別 通知範囲</div>
      <div style="font-size:12px; color:#999; margin-bottom:10px;">ジャンルより広い場合はこちらを優先</div>
      <div class="setting-row">
        <div><div class="setting-label">★ 気になる</div></div>
        <div class="time-input"><input type="number" id="f-1" value="5" min="1" max="60" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">★★ 行きたい</div></div>
        <div class="time-input"><input type="number" id="f-2" value="15" min="1" max="60" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">★★★ 絶対行く</div></div>
        <div class="time-input"><input type="number" id="f-3" value="30" min="1" max="120" /><span style="font-size:13px; color:#888;">分以内</span></div>
      </div>
    </div>
    <button class="primary" style="width:100%;" onclick="saveSettings()">設定を保存する</button>
  </div>
</div>

<script>
let selectedFav = 3;
let transport = 'train';
let stores = JSON.parse(localStorage.getItem('shops') || '[]');
let nextId = stores.length > 0 ? Math.max(...stores.map(s=>s.id)) + 1 : 1;
let importBuffer = [];

function saveStores() { localStorage.setItem('shops', JSON.stringify(stores)); }

function getSettings() {
  return {
    genreTime: {
      "カフェ・パン": parseInt(document.getElementById('t-cafe').value)||10,
      "ランチ・ごはん": parseInt(document.getElementById('t-cafe').value)||10,
      "雑貨・服・本": parseInt(document.getElementById('t-goods').value)||7,
      "特別な店": parseInt(document.getElementById('t-special').value)||15,
      "その他": 10,
    },
    favTime: {
      1: parseInt(document.getElementById('f-1').value)||5,
      2: parseInt(document.getElementById('f-2').value)||15,
      3: parseInt(document.getElementById('f-3').value)||30,
    }
  };
}

function effectiveTime(store) {
  const s = getSettings();
  return Math.max(s.genreTime[store.genre]||10, s.favTime[store.fav]||10);
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  const map = {search:0, add:1, list:2, import:3, settings:4};
  document.querySelectorAll('.tab')[map[name]].classList.add('active');
  if(name === 'list') renderList();
}

function setFav(n) {
  selectedFav = n;
  [1,2,3].forEach(i => document.getElementById('fav'+i).classList.toggle('selected', i===n));
}

function setTransport(t) {
  transport = t;
  ['walk','train','car'].forEach(k => document.getElementById('t-'+k).classList.toggle('selected', k===t));
}

function searchStores() {
  const dest = document.getElementById('dest-input').value.trim();
  const container = document.getElementById('search-results');
  if(!dest) { container.innerHTML = '<div class="empty">目的地を入力してください</div>'; return; }
  const matched = stores.filter(s => s.area && (s.area.includes(dest) || dest.includes(s.area)));
  if(matched.length === 0) {
    container.innerHTML = `<div class="result-card"><div style="font-size:14px; font-weight:500;">${dest}付近の保存店はありません</div><div style="font-size:12px; color:#999; margin-top:4px;">「登録」か「取り込む」から追加しよう</div></div>`;
    return;
  }
  const tLabel = {walk:"徒歩", train:"電車", car:"車"}[transport];
  let html = `<div class="result-card"><div style="font-size:15px; font-weight:500; margin-bottom:12px;">📍 ${dest}付近に ${matched.length}件あります</div>`;
  matched.forEach(s => {
    const mins = effectiveTime(s);
    const favLabel = {1:"★",2:"★★",3:"★★★"}[s.fav]||"★★";
    const favName = {1:"気になる",2:"行きたい",3:"絶対行く"}[s.fav]||"行きたい";
    html += `<div class="store-item">
      <div>
        <div class="store-name">${s.name}<span class="badge-fav">${favLabel} ${favName}</span>${s.imported?'<span class="badge-import">Gマップ</span>':''}</div>
        <div class="store-meta">${s.area||'エリア未設定'} · ${s.genre||'その他'}</div>
        <div style="font-size:11px; color:#0F6E56; margin-top:2px;">${tLabel}${mins}分以内で通知</div>
      </div>
      <span class="badge-match">保存済み</span>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function addStore() {
  const name = document.getElementById('add-name').value.trim();
  const area = document.getElementById('add-area').value.trim();
  const genre = document.getElementById('add-genre').value;
  const memo = document.getElementById('add-memo').value.trim();
  if(!name || !area || !genre) { alert('店名・エリア・ジャンルを入力してください'); return; }
  stores.push({ id: nextId++, name, area, genre, fav: selectedFav, memo, imported: false });
  saveStores();
  document.getElementById('add-name').value = '';
  document.getElementById('add-area').value = '';
  document.getElementById('add-genre').value = '';
  document.getElementById('add-memo').value = '';
  setFav(3);
  alert(`「${name}」を登録しました！`);
}

function deleteStore(id) {
  if(!confirm('削除しますか？')) return;
  stores = stores.filter(s => s.id !== id);
  saveStores();
  renderList();
}

function renderList() {
  const container = document.getElementById('store-list-container');
  const countEl = document.getElementById('list-count');
  if(stores.length === 0) {
    container.innerHTML = '<div class="empty">まだお店が登録されていません</div>';
    countEl.textContent = '';
    return;
  }
  countEl.textContent = `${stores.length}件登録済み`;
  const favLabel = {1:"★",2:"★★",3:"★★★"};
  let html = '';
  stores.forEach(s => {
    html += `<div class="store-item">
      <div style="flex:1;">
        <div class="store-name">${s.name}<span class="badge-fav">${favLabel[s.fav]||'★★'}</span>${s.imported?'<span class="badge-import">Gマップ</span>':''}</div>
        <div class="store-meta">${s.area||'エリア未設定'} · ${s.genre||'その他'}</div>
      </div>
      <button style="font-size:12px; padding:4px 8px; border:none; color:#999;" onclick="deleteStore(${s.id})">🗑</button>
    </div>`;
  });
  container.innerHTML = html;
}

// ファイル読み込み（CSV/JSON両対応）
function loadFile(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    if(file.name.endsWith('.json')) {
      parseJSON(content);
    } else {
      parseCSV(content);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  // 1行目はヘッダー、2行目は空行の場合あり
  const items = [];
  for(let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    const name = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
    const url = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
    if(!name) continue;
    items.push({ name, url, area: '', checked: true });
  }
  importBuffer = items;
  renderImportPreview();
}

function parseJSON(text) {
  try {
    const data = JSON.parse(text);
    const features = data.features || [];
    importBuffer = features.map(f => ({
      name: f.properties.name || '名称なし',
      url: '',
      area: extractArea(f.properties.address || ''),
      checked: true,
    }));
    renderImportPreview();
  } catch(e) {
    alert('読み込みに失敗しました');
  }
}

function extractArea(address) {
  const match = address.match(/([^\s、，,]+[区市町村])/);
  if(match) return match[1];
  const parts = address.split(',');
  if(parts.length > 1) return parts[parts.length - 2].trim();
  return '';
}

function renderImportPreview() {
  const container = document.getElementById('import-preview');
  if(importBuffer.length === 0) { container.innerHTML = ''; return; }
  let html = `<div class="card">
    <div style="font-size:13px; font-weight:500; margin-bottom:4px;">${importBuffer.length}件見つかりました</div>
    <div style="font-size:12px; color:#888; margin-bottom:12px;">取り込みたいものにチェックを入れてください。エリアは後で編集できます。</div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button onclick="selectAllImport(true)" style="font-size:12px;">全選択</button>
      <button onclick="selectAllImport(false)" style="font-size:12px;">全解除</button>
      <button class="primary" style="flex:1;" onclick="doImport()">選択した店を取り込む</button>
    </div>`;
  importBuffer.forEach((item, i) => {
    html += `<div class="import-item">
      <input type="checkbox" id="chk_${i}" ${item.checked?'checked':''} onchange="importBuffer[${i}].checked=this.checked" />
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:500;">${item.name}</div>
        ${item.area ? `<div style="font-size:11px; color:#888;">${item.area}</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function selectAllImport(val) {
  importBuffer.forEach((item, i) => {
    item.checked = val;
    document.getElementById('chk_'+i).checked = val;
  });
}

function doImport() {
  const selected = importBuffer.filter(i => i.checked);
  if(selected.length === 0) { alert('選択してください'); return; }
  selected.forEach(item => {
    stores.push({
      id: nextId++,
      name: item.name,
      area: item.area || 'エリア未設定',
      genre: 'その他',
      fav: 2,
      memo: '',
      imported: true,
    });
  });
  saveStores();
  document.getElementById('import-preview').innerHTML = '';
  document.getElementById('file-input').value = '';
  alert(`${selected.length}件取り込みました！`);
  showTab('list');
}

function saveSettings() {
  const settings = { transport,
    tCafe: document.getElementById('t-cafe').value,
    tGoods: document.getElementById('t-goods').value,
    tSpecial: document.getElementById('t-special').value,
    f1: document.getElementById('f-1').value,
    f2: document.getElementById('f-2').value,
    f3: document.getElementById('f-3').value,
  };
  localStorage.setItem('shopSettings', JSON.stringify(settings));
  alert('設定を保存しました！');
}

const saved = JSON.parse(localStorage.getItem('shopSettings') || '{}');
if(saved.transport) setTransport(saved.transport);
if(saved.tCafe) document.getElementById('t-cafe').value = saved.tCafe;
if(saved.tGoods) document.getElementById('t-goods').value = saved.tGoods;
if(saved.tSpecial) document.getElementById('t-special').value = saved.tSpecial;
if(saved.f1) document.getElementById('f-1').value = saved.f1;
if(saved.f2) document.getElementById('f-2').value = saved.f2;
if(saved.f3) document.getElementById('f-3').value = saved.f3;
</script>
</body>
</html>
